server:
    port: 8080

spring:
    datasource:
        url: jdbc:mysql://localhost:3306/finance_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
        username: root
        password: 123456
        driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
    mapper-locations: classpath*:mapper/*.xml
    type-aliases-package: com.project.finance.entity
    configuration:
        map-underscore-to-camel-case: true
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
        db-config:
            id-type: auto


logging:
    level:
        com.project.finance.mapper: debug
        com.baomidou.mybatisplus: debug


app:
    jwt:
        secret: 7VjK8#mN2$pL9@rE5tY6&wQ3*xZ1+cA4/sF8-hG7!dJ9=vB0#uP2%oI5*nS6?qW7
        expireSeconds: 604800 # 7 days
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB
    upload:
        dir: E:/DeliveryOptimization/project/code/uploads
    server:
        url: http://localhost:8080
