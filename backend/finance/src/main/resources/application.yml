server:
    port: 8080

spring:
    datasource:
        url: jdbc:mysql://localhost:3306/finance_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
        username: root
        password: 123456
        driver-class-name: com.mysql.cj.jdbc.Driver
# application.yml
mybatis-plus:
    mapper-locations: classpath*:mapper/*.xml
    type-aliases-package: com.project.finance.entity
    configuration:
        map-underscore-to-camel-case: true
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
        db-config:
            id-type: auto

logging:
    level:
        com.project.finance.mapper: debug
        com.baomidou.mybatisplus: debug


app:
    jwt:
        secret: replace_this_with_strong_secret
        expireSeconds: 604800 # 7 days